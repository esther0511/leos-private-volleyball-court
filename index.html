<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排球場</title>
<style>
:root{--navy:#1d2a50;--face:#355c97;--orange:#e0a176;--sky:#52aed4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#161f3f;--face:#2c4f85}}
:root[data-theme="dark"]{--navy:#161f3f;--face:#2c4f85}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;color:#fff;font-size:14px;letter-spacing:.06em;background:rgba(29,42,80,.6);padding:6px 16px;border-radius:999px;transition:opacity 1.2s;pointer-events:none;text-align:center;max-width:92vw}
#pad{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}
#pad[hidden]{display:none}
.back{position:absolute;inset:0;background:rgba(10,20,50,.6);opacity:0;transition:opacity .5s}
#pad.on .back{opacity:1}
.card{position:relative;width:min(94vw,640px);max-height:92vh;display:flex;flex-direction:column;gap:10px;background:var(--face);border:8px solid var(--navy);border-radius:18px;padding:14px;color:#fff;box-shadow:0 10px 0 var(--navy),0 24px 60px rgba(0,0,0,.4);-webkit-user-select:text;user-select:text}
.top{display:flex;align-items:center;font-size:20px;font-weight:800;letter-spacing:.3em}
.top .btn{margin-left:auto}
.btn{border:0;background:var(--navy);color:#fff;padding:8px 18px;border-radius:999px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.95)}
.btn:focus-visible,textarea:focus-visible,.em:focus-visible{outline:3px solid #fff;outline-offset:2px}
#ems{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:6px}
.em{border:0;background:var(--navy);border-radius:12px;padding:6px;cursor:pointer;display:flex;justify-content:center;transition:transform .15s}
.em img{
  width:100%;
  max-width:44px;
  aspect-ratio:1;
  object-fit:contain;
  display:block;
}
.em:hover{transform:translateY(-3px) rotate(-4deg)}
.em.sel{outline:3px solid #fff;transform:translateY(-3px)}
textarea{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;border:0;border-radius:10px;padding:12px;background:var(--orange);color:var(--navy);font:inherit;font-size:17px;line-height:1.6}
textarea::placeholder{color:rgba(29,42,80,.6)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.foot{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding-top:12px;
  margin-top:4px;
  border-top:1px solid rgba(255,255,255,.22);
}

.foot .btn{
  font-size:13px;
  padding:7px 14px;
  opacity:.8;
}
#list{margin:0;padding:0;list-style:none;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
#list li{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.13);border-radius:10px;padding:8px 10px;line-height:1.5;animation:in .4s}
#list li svg,
#list li img{
  width:26px;
  height:26px;
  flex:none;
  object-fit:contain;
}
#list li div{flex:1;white-space:pre-wrap;word-break:break-word}
#list button{border:0;background:none;color:#fff;font-size:14px;cursor:pointer;opacity:.7}
#list button:hover{opacity:1}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

/* 手機版：八種表情分成兩排 */

@media (max-width:560px){

  #ems{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .card{
    padding:10px;
  }

  .row{
    flex-wrap:wrap;
  }

}

/* ===== 星白音符與雙音量控制 ===== */

#musicToggle {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));

  z-index: 9;
  width: 52px;
  height: 52px;
  padding: 0;

  display: grid;
  place-items: center;

  color: #fff;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 14px;

  cursor: pointer;
  touch-action: none;

  opacity: 1;
  filter: drop-shadow(0 0 4px rgba(255,255,255,.65));

  transition:
    opacity .25s,
    background .2s,
    border-color .2s,
    filter .25s;
}

/* 操作時才出現淡淡的底板 */
#musicToggle:hover,
#musicToggle.holding,
#musicToggle:focus-visible {
  background: rgba(29,42,80,.3);
  border-color: rgba(255,255,255,.24);
}

#musicToggle:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 2px;
}

/* 關閉／靜音：25% 不透明 */
#musicToggle.off {
  opacity: .25;
  filter: none;
}

#musicToggle svg {
  pointer-events: none;
}

/* 聲波依照音量顯示 */
#musicToggle .wave {
  opacity: 0;
  transition: opacity .2s;
}

#musicToggle[data-waves="1"] .wave1,
#musicToggle[data-waves="2"] .wave1,
#musicToggle[data-waves="2"] .wave2,
#musicToggle[data-waves="3"] .wave1,
#musicToggle[data-waves="3"] .wave2,
#musicToggle[data-waves="3"] .wave3 {
  opacity: 1;
}


/* ===== 無面板懸浮式雙音量滑桿 ===== */

#musicVolumePanel {
  position: fixed;

  top: calc(72px + env(safe-area-inset-top, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));

  z-index: 10;

  width: 116px;
  padding: 8px 4px 6px;

  /* 完全取消底板 */
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;

  -webkit-backdrop-filter: none;
  backdrop-filter: none;

  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transform: translateY(-8px);

  transition:
    opacity 0.25s ease,
    visibility 0.25s ease,
    transform 0.25s ease;
}

/* 長按音符後顯示 */
#musicVolumePanel.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}

/* 兩條滑桿並排 */
.volumeColumns {
  display: flex;
  justify-content: space-around;
  align-items: center;
  gap: 18px;
}

.volumeColumn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

/* ===== 滑桿本體 ===== */

.volumeColumn input {
  -webkit-appearance: none;
  appearance: none;

  width: 22px;
  height: 110px;
  margin: 0;

  writing-mode: vertical-lr;
  direction: rtl;

  background: transparent;
  cursor: pointer;
  touch-action: none;
}

/* Chrome、Safari：半透明細滑軌 */
.volumeColumn input::-webkit-slider-runnable-track {
  -webkit-appearance: none;

  width: 4px;
  height: 100%;

  background: rgba(255, 255, 255, 0.3);

  border: none;
  border-radius: 999px;
}

/* Chrome、Safari：白色圓形滑塊 */
.volumeColumn input::-webkit-slider-thumb {
  -webkit-appearance: none;

  width: 17px;
  height: 17px;

  margin-left: -6.5px;

  background: rgba(255, 255, 255, 0.85);

  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 50%;

  box-shadow:
    0 0 8px rgba(255, 255, 255, 0.22);

  cursor: grab;
}

/* Firefox：半透明滑軌 */
.volumeColumn input::-moz-range-track {
  width: 4px;

  background: rgba(255, 255, 255, 0.3);

  border: none;
  border-radius: 999px;
}

/* Firefox：白色滑塊 */
.volumeColumn input::-moz-range-thumb {
  width: 17px;
  height: 17px;

  background: rgba(255, 255, 255, 0.85);

  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 50%;

  box-shadow:
    0 0 8px rgba(255, 255, 255, 0.22);
}

/* ===== 音樂、音效文字 ===== */

.volumeColumn label {
  color: rgba(255, 255, 255, 0.78);

  font-size: 12px;
  font-weight: 500;

  letter-spacing: 0.08em;

  white-space: nowrap;

  text-shadow:
    0 1px 4px rgba(0, 0, 0, 0.25);
}

/* 操作時，滑塊稍微亮一點 */
.volumeColumn input:hover::-webkit-slider-thumb,
.volumeColumn input:active::-webkit-slider-thumb {
  background: #ffffff;
}

/* ===== 音符永遠不顯示底板 ===== */

#musicToggle,
#musicToggle:hover,
#musicToggle.holding,
#musicToggle:focus-visible {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
}

/* ===== 生日彩蛋：暗場與橫幅 ===== */

/* 場景短暫變暗，不阻擋任何點擊 */
#bdayShade {
  position: fixed;
  inset: 0;
  z-index: 6;
  background: #061124;
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T3=THREE,$=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),PI=Math.PI;
/* ===== 正式版／開發版資料隔離 ===== */

const VB_IS_DEV =
  new URLSearchParams(location.search).get('vbDev') === '1';

const VB_DEV_STATE = {
  visitDay: 1
};

// 正式版維持原本的儲存名稱。
// 開發版的儲存名稱自動加上 vb-dev-。
const vbStore = {

  getItem(key) {
    const name = (VB_IS_DEV ? 'vb-dev-' : '') + key;
    return window['localStorage'].getItem(name);
  },

  setItem(key, value) {
    const name = (VB_IS_DEV ? 'vb-dev-' : '') + key;
    window['localStorage'].setItem(name, value);
  },

  removeItem(key) {
    const name = (VB_IS_DEV ? 'vb-dev-' : '') + key;
    window['localStorage'].removeItem(name);
  }

};
const R=new T3.WebGLRenderer({canvas:$('#c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new T3.Scene();sc.fog=new T3.Fog(0x62bfe8,70,230);sc.background=new T3.Color(0x62bfe8);
const cam=new T3.PerspectiveCamera(45,1,.5,500);
const L=c=>new T3.MeshLambertMaterial({color:c});
const ghost=()=>new T3.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false});
const hitList=[],acts=[];
const amb=new T3.AmbientLight(0xffffff,.8),sunL=new T3.DirectionalLight(0xffffff,.4);sc.add(amb,sunL);
const mkFlat=(w,d,y,c)=>{const m=new T3.Mesh(new T3.PlaneGeometry(w,d),L(c));m.rotation.x=-PI/2;m.position.y=y;return m};

/* ground, hills, court */
const ground=new T3.Mesh(new T3.CircleGeometry(150,64),L(0x52aed4));ground.rotation.x=-PI/2;ground.userData.block=1;sc.add(ground);hitList.push(ground);
for(let i=0;i<16;i++){const a=i/16*PI*2+rnd(-.1,.1),r=rnd(88,112),h=rnd(9,22),h0=new T3.Mesh(new T3.ConeGeometry(rnd(14,24),h,7),L(0x4d8fbb));
  h0.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);h0.userData.block=1;sc.add(h0);hitList.push(h0)}
const court=new T3.Group();court.userData.block=1;sc.add(court);hitList.push(court);
court.add(mkFlat(24,15,.01,0x355c97),mkFlat(18,9,.02,0xe0a176));
const ln=(x,z,w,d)=>{const m=mkFlat(w,d,.03,0xffffff);m.position.x=x;m.position.z=z;court.add(m)};
[-1,1].forEach(s=>{ln(0,s*4.5,18.12,.12);ln(s*9,0,.12,9.12);ln(s*3,0,.1,9)});ln(0,0,.12,9);
[-3,0,3].forEach(x=>[-1,1].forEach(s=>{for(let k=0;k<5;k++)ln(x,s*(4.85+k*.6),.1,.34)}));

/* net, posts, flames */
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,210,120,1)');r.addColorStop(.4,'rgba(255,140,60,.4)');r.addColorStop(1,'rgba(255,120,40,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new T3.CanvasTexture(c)})();
const netTex=(()=>{const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');g.strokeStyle='#fff';g.lineWidth=1.6;g.strokeRect(0,0,16,16);const t=new T3.CanvasTexture(c);t.wrapS=t.wrapT=T3.RepeatWrapping;t.repeat.set(40,5);return t})();
const netG=new T3.PlaneGeometry(9.9,1,30,6);netG.rotateY(PI/2);
const net=new T3.Mesh(netG,new T3.MeshBasicMaterial({map:netTex,transparent:true,side:T3.DoubleSide,alphaTest:.1}));net.position.set(0,1.93,0);sc.add(net);
const netBase=Float32Array.from(netG.attributes.position.array);let netAmp=0;
const tape=new T3.Mesh(new T3.BoxGeometry(.06,.09,9.9),L(0xffffff));tape.position.set(0,2.39,0);sc.add(tape);
const swayNet=()=>{netAmp=.28;sfxNet()};net.userData.act=swayNet;hitList.push(net);
const flames=[],poles=[];
[-1,1].forEach((s,i)=>{
  const p=new T3.Mesh(new T3.CylinderGeometry(.13,.13,2.43,20),L(0x1d2a50));p.position.set(0,1.215,s*5.1);sc.add(p);poles.push(p);
  const g=new T3.Group();g.position.set(0,2.43,s*5.1);
  const o=new T3.Mesh(new T3.ConeGeometry(.11,.42,10),new T3.MeshBasicMaterial({color:0xcc5a38}));o.position.y=.24;
  const n=new T3.Mesh(new T3.ConeGeometry(.06,.24,10),new T3.MeshBasicMaterial({color:0xf2e06b}));n.position.y=.15;
  const gl=new T3.Sprite(new T3.SpriteMaterial({map:glowTex,blending:T3.AdditiveBlending,transparent:true,depthWrite:false,fog:false}));gl.scale.set(3.2,3.2,1);gl.position.y=.25;
  const pl=new T3.PointLight(0xffa850,0,9);pl.position.y=.4;
  const px=new T3.Mesh(new T3.SphereGeometry(.4,8,8),ghost());px.position.y=.3;
  g.add(o,n,gl,pl,px);sc.add(g);
  const f={g,gl,pl,t:99,pop:0,i};flames.push(f);
  // 點擊火焰：熄滅，之後自然重新燃起
// 點擊火焰：熄滅並記錄時間
px.userData.act = () => {

  if (f.t > 7) {

    f.t = 0;

    // 判斷是否在 1.5 秒內吹熄另一根
    registerCandleBlow(f.i);
  }

};
  
hitList.push(px);

// 點擊球柱：閃光並播放音效
p.userData.act = () => {
  p.material.emissive.setHex(0x4466aa);
  f.pop = 0.6;
  sfxPole();
};

hitList.push(p);

});

/* trees */
/* trees */
const trees=[];

/* ===== 真實樹葉沙沙聲 ===== */

const treeRustleAudio = new Audio(
  'assets/sounds/tree-rustle.mp3'
);

treeRustleAudio.preload = 'auto';
treeRustleAudio.volume = 0.18;

let lastTreeRustle = 0;

function playTreeRustle() {

  // 樹葉音效使用獨立的音效音量
  treeRustleAudio.volume =
    0.18 * getSfxVolumeLevel();

  if (treeRustleAudio.volume === 0) return;
  const now = performance.now();

  if (now - lastTreeRustle < 400) return;

  lastTreeRustle = now;

  treeRustleAudio.pause();
  treeRustleAudio.currentTime = 0;

  treeRustleAudio.play().catch(() => {});
}

/* ===== 樹葉飄落系統 ===== */

const fallingLeaves = [];

// 葉片形狀
const leafShape = new T3.Shape();

leafShape.moveTo(0, -0.12);
leafShape.quadraticCurveTo(-0.13, 0, 0, 0.15);
leafShape.quadraticCurveTo(0.13, 0, 0, -0.12);

const leafGeometry = new T3.ShapeGeometry(leafShape);

// 樹葉顏色
const leafColors = [
  0x5fae93,
  0x79c7ac,
  0x8bbba9,
  0xe0a176
];

// 點擊樹木後產生落葉
function dropLeaves(tree, palette = leafColors) {

  const origin = new T3.Vector3();
  tree.g.getWorldPosition(origin);

  // 每次掉落 5～8 片，限制同時存在的葉片數量
  const count = Math.min(
    5 + Math.floor(Math.random() * 4),
    80 - fallingLeaves.length
  );

  for (let i = 0; i < count; i++) {

    const material = new T3.MeshBasicMaterial({
      color: palette[
        Math.floor(Math.random() * palette.length)
      ],
      side: T3.DoubleSide,
      transparent: true,
      opacity: 1,
      depthWrite: false
    });

    const leaf = new T3.Mesh(
      leafGeometry,
      material
    );

    leaf.position.set(
      origin.x + rnd(-0.85, 0.85),
      origin.y + rnd(2.2, 3.4),
      origin.z + rnd(-0.85, 0.85)
    );

    leaf.rotation.set(
      rnd(0, PI),
      rnd(0, PI),
      rnd(-PI, PI)
    );

    leaf.scale.setScalar(rnd(0.8, 1.3));

    sc.add(leaf);

    fallingLeaves.push({
      mesh: leaf,
      age: 0,
      speed: rnd(0.55, 0.95),
      driftX: rnd(-0.15, 0.15),
      driftZ: rnd(-0.15, 0.15),
      spin: rnd(-2, 2),
      phase: rnd(0, PI * 2)
    });
  }
}

const tgtP = new T3.Vector3(0, 1, 0);

const cameraForward = new T3.Vector3();
const cameraRight = new T3.Vector3();
const cameraAim = new T3.Vector3();
const cameraUp = new T3.Vector3(0, 1, 0);

function camStep() {
tgtP.y += ((hover ? 4 : 1) - tgtP.y) * 0.05;
  
  // 攝影機平滑移動
  cs.th += (ct.th - cs.th) * 0.18;
  cs.ph += (ct.ph - cs.ph) * 0.18;
  cs.d += (ct.d - cs.d) * 0.18;
  cs.tilt += (ct.tilt - cs.tilt) * 0.18;

  // 環繞球場的位置
  cam.position.set(
    tgtP.x + cs.d * Math.sin(cs.ph) * Math.sin(cs.th),
    tgtP.y + cs.d * Math.cos(cs.ph),
    tgtP.z + cs.d * Math.sin(cs.ph) * Math.cos(cs.th)
  );

  // 保留殺球的攝影機震動
  if (shake > 0.01) {
    cam.position.x += rnd(-1, 1) * shake;
    cam.position.y += rnd(-1, 1) * shake;
    shake *= 0.92;
  }

  // 計算觀看方向
  cameraForward.subVectors(tgtP, cam.position).normalize();

  cameraRight.crossVectors(
    cameraForward,
    cameraUp
  ).normalize();

  // 讓攝影機可以抬頭與低頭
  cameraForward.applyAxisAngle(
    cameraRight,
    cs.tilt
  );

  cameraAim.copy(cam.position).add(cameraForward);

  cam.lookAt(cameraAim);
}

function ballNeedsRecall() {

  const p = ball.position;

  // 球離球場中心太遠
  const far = Math.hypot(p.x, p.z) > 24;

  // 球已經離開主要球場範圍
  const outside =
    Math.abs(p.x) > 10 ||
    Math.abs(p.z) > 5.5;

  // 判斷是否還在攝影機畫面內
  const q = p.clone().project(cam);

  const offscreen =
    Math.abs(q.x) > 1.05 ||
    Math.abs(q.y) > 1.05 ||
    q.z < -1 ||
    q.z > 1;

  return far || (outside && offscreen);
}

  if (p.y < 2.85) {
    popText('先讓球高過球網，再點對面場地！');

  if (
    Math.abs(point.x) > 8.8 ||
    Math.abs(point.z) > 4.3 ||
    Math.abs(point.x) < 0.7 ||
    p.x * point.x >= 0
  ) {
    popText('請點球網另一側的場內落點！');
    return;

    point.x,
    BR,
    point.z

    to.x - from.x,
    to.z - from.z
  );

  const cross = -from.x / (to.x - from.x);

    from.z + (to.z - from.z) * cross;

// 彩帶飄落
function birthdayRibbonStep(dt) {

  if (!ribbonMesh.visible) return;

  let moving = false;

  ribbons.forEach((r, i) => {

    r.age += dt;

    r.vy = Math.max(
      -2.8,
      r.vy - 8 * dt
    );

    r.x += r.vx * dt;
    r.y = Math.max(0.13, r.y + r.vy * dt);
    r.z += r.vz * dt;

    r.rx += r.spin * dt;
    r.rz += r.spin * 0.7 * dt;

    if (r.y <= 0.13) {
      r.vy = 0;
      r.vx *= 0.94;
      r.vz *= 0.94;
    }

    if (r.age < 10) moving = true;

    ribbonDummy.position.set(
      r.x,
      r.y,
      r.z
    );

    ribbonDummy.rotation.set(
      r.rx,
      r.ry,
      r.rz
    );

    ribbonDummy.scale.setScalar(
      Math.min(
        1,
        Math.max(0.001, (10 - r.age) / 2)
      )
    );

    ribbonDummy.updateMatrix();

    ribbonMesh.setMatrixAt(
      i,
      ribbonDummy.matrix
    );
  });

  ribbonMesh.instanceMatrix.needsUpdate = true;

  if (!moving) {
    ribbonMesh.visible = false;
  }
}

const FLOWERS_PER_TREE = 46;
const flowerDummy = new T3.Object3D();

const flowerSets = trees.map(tree => {
  const mesh = new T3.InstancedMesh(
    new T3.PlaneGeometry(.38, .38),
    new T3.MeshBasicMaterial({ map: flowerTex, transparent: true, alphaTest: .3, side: T3.DoubleSide }),
    FLOWERS_PER_TREE
  );
  mesh.frustumCulled = false;
  mesh.visible = false;

  const pts = [];
  for (let i = 0; i < FLOWERS_PER_TREE; i++) {
    const n = new T3.Vector3();
    for (let tries = 0; tries < 30; tries++) {
      n.set(rnd(-1, 1), rnd(-.25, 1), rnd(-1, 1)).normalize();
      if (pts.every(p => p.n.dot(n) < .93)) break;   // 彼此不要太近
    }
    const q = new T3.Quaternion().setFromUnitVectors(new T3.Vector3(0, 0, 1), n);
    q.premultiply(new T3.Quaternion().setFromAxisAngle(n, rnd(0, PI * 2)));
    pts.push({
      n: n.clone(), q,
      pos: n.clone().multiplyScalar(1.22).add(new T3.Vector3(0, 2.5, 0)),  // 在樹冠表面外側
      delay: rnd(0, 3.2), size: rnd(.8, 1.25)
    });
  }

  tree.g.add(mesh);
  return { mesh, pts };
});

function flowerStep(t) {
  const out = c01((BDAY_LENGTH - .35 - t) / .65);
  flowerSets.forEach(set => {
    set.pts.forEach((p, i) => {
      const bloom = c01((t - 1.6 - p.delay) / .9);
      const s = easeOutBack(bloom) * p.size * out;
      flowerDummy.position.copy(p.pos);
      flowerDummy.quaternion.copy(p.q);
      flowerDummy.scale.setScalar(Math.max(.001, s));
      flowerDummy.updateMatrix();
      set.mesh.setMatrixAt(i, flowerDummy.matrix);
    });
    set.mesh.instanceMatrix.needsUpdate = true;
  });
}

function fwEmit(x, y, z, vx, vy, vz, c, life, drag, grav, tw) {
  const i = fwCursor;
  fwCursor = (fwCursor + 1) % FWN;
  fwPos[i * 3] = x; fwPos[i * 3 + 1] = y; fwPos[i * 3 + 2] = z;
  fwVel[i * 3] = vx; fwVel[i * 3 + 1] = vy; fwVel[i * 3 + 2] = vz;
  fwBase[i * 3] = c.r; fwBase[i * 3 + 1] = c.g; fwBase[i * 3 + 2] = c.b;
  fwLife[i] = fwMax[i] = life;
  fwDrag[i] = drag; fwGrav[i] = grav; fwTw[i] = tw;
}

function fwStep(dt) {
  let any = false;
  for (let i = 0; i < FWN; i++) {
    if (fwLife[i] <= 0) continue;
    any = true;
    fwLife[i] -= dt;
    const k = Math.pow(fwDrag[i], dt * 60);
    fwVel[i * 3] *= k;
    fwVel[i * 3 + 1] = fwVel[i * 3 + 1] * k + fwGrav[i] * dt;
    fwVel[i * 3 + 2] *= k;
    fwPos[i * 3] += fwVel[i * 3] * dt;
    fwPos[i * 3 + 1] += fwVel[i * 3 + 1] * dt;
    fwPos[i * 3 + 2] += fwVel[i * 3 + 2] * dt;
    let f = Math.pow(Math.max(0, fwLife[i] / fwMax[i]), 1.4);
    if (fwTw[i]) f *= .6 + .4 * Math.sin(clk * 30 + i);
    if (fwLife[i] <= 0) f = 0;
    fwCol[i * 3] = fwBase[i * 3] * f;
    fwCol[i * 3 + 1] = fwBase[i * 3 + 1] * f;
    fwCol[i * 3 + 2] = fwBase[i * 3 + 2] * f;
  }
  if (any) {
    fwGeo.attributes.position.needsUpdate = true;
    fwGeo.attributes.color.needsUpdate = true;
  }
}

  const c = new T3.Color(color);
  const c2 = new T3.Color(bday.theme.fw[(Math.random() * bday.theme.fw.length) | 0]);

  // 愛心與圓環面向鏡頭，才會看起來是正的
  const n = new T3.Vector3().subVectors(cam.position, new T3.Vector3(x, y, z)).normalize();
  const U = new T3.Vector3().crossVectors(new T3.Vector3(0, 1, 0), n).normalize();
  const V = new T3.Vector3().crossVectors(n, U).normalize();
  const v = new T3.Vector3();
  const emit = (col, life, drag, grav) => fwEmit(x, y, z, v.x, v.y, v.z, col, life, drag, grav, 1);
  const sph = s => {
    const u = rnd(-1, 1), a = rnd(0, PI * 2), r = Math.sqrt(1 - u * u);
    v.set(Math.cos(a) * r * s, u * s, Math.sin(a) * r * s);
  };

  if (type === 'peony' || type === 'double') {
    for (let k = 0; k < (type === 'double' ? 120 : 170); k++) { sph(rnd(15, 20)); emit(c, rnd(1.7, 2.5), .96, -2.4); }
    if (type === 'double') for (let k = 0; k < 70; k++) { sph(rnd(6, 9)); emit(c2, rnd(1.4, 2), .95, -2); }
  } else if (type === 'ring') {
    for (let k = 0; k < 100; k++) {
      const a = k / 100 * PI * 2;
      v.copy(U).multiplyScalar(Math.cos(a) * 17).addScaledVector(V, Math.sin(a) * 17);
      emit(c, 2.3, .96, -1.8);
    }
  } else if (type === 'heart') {
    for (let k = 0; k < 130; k++) {
      const a = k / 130 * PI * 2;
      const hx = 16 * Math.pow(Math.sin(a), 3);
      const hy = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      v.copy(U).multiplyScalar(hx * 1.0).addScaledVector(V, hy * 1.0);
      emit(c, 2.8, .96, -1.6);
    }
  } else if (type === 'willow') {
    for (let k = 0; k < 140; k++) { sph(rnd(10, 17)); emit(FW_WARM, rnd(3.2, 4.4), .972, -1.5); }
  }

  bday.flash = Math.min(1, bday.flash + .45);
  playFirework();
}

const rockets = [];

function launchRocket(type, color, wait = 0) {
  rockets.push({ kind: 'rocket', x: rnd(-20, 20), z: rnd(-22, 4), y: .4, ty: rnd(20, 31), vy: rnd(27, 33), type, color, wait });
}

function launchMeteor(wait = 0) {
  rockets.push({ kind: 'meteor', x: rnd(-30, 10), y: rnd(30, 45), z: rnd(-35, -10), vx: rnd(14, 20), vy: rnd(-9, -6), life: rnd(1, 1.6), wait });
}

function rocketStep(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    if (r.wait > 0) { r.wait -= dt; continue; }

    if (r.kind === 'meteor') {
      r.x += r.vx * dt; r.y += r.vy * dt; r.life -= dt;
      for (let k = 0; k < 3; k++) fwEmit(r.x - rnd(0, .8), r.y + rnd(-.2, .2), r.z, 0, 0, 0, FW_WHITE, .7, .9, 0, 0);
      if (r.life <= 0) rockets.splice(i, 1);
      continue;
    }

    r.y += r.vy * dt;
    r.vy = Math.max(10, r.vy - 6 * dt);
    for (let k = 0; k < 2; k++) fwEmit(r.x + rnd(-.1, .1), r.y, r.z + rnd(-.1, .1), rnd(-.4, .4), rnd(-1.5, -.5), rnd(-.4, .4), FW_WARM, .55, .94, -2, 0);
    if (r.y >= r.ty) { fwBurst(r.x, r.y, r.z, r.type, r.color); rockets.splice(i, 1); }
  }
}

const bdayLanterns = [];

function lanternTex(ch) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 320;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 170, 10, 128, 170, 190);
  gr.addColorStop(0, '#fff3c4');
  gr.addColorStop(.6, '#ffc97a');
  gr.addColorStop(1, '#e98a45');
  g.fillStyle = gr;
  g.fillRect(0, 0, 256, 320);
  g.strokeStyle = 'rgba(120,50,20,.55)';
  g.lineWidth = 6;
  g.strokeRect(10, 10, 236, 300);
  g.fillStyle = 'rgba(120,50,20,.35)';
  g.fillRect(10, 40, 236, 5);
  g.fillRect(10, 275, 236, 5);
  if (ch) {
    g.fillStyle = '#7a2e1a';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = '800 170px "PingFang TC","Noto Sans TC","Microsoft JhengHei",serif';
    g.fillText(ch, 128, 164);
  }
  return new T3.CanvasTexture(c);
}

function makeLantern(ch, scale) {
  const tex = lanternTex(ch);
  const side = new T3.MeshBasicMaterial({ map: tex, transparent: true, fog: false });
  const cap = new T3.MeshBasicMaterial({ color: 0xffd08a, transparent: true, fog: false });
  const g = new T3.Group();
  g.add(new T3.Mesh(new T3.BoxGeometry(1.15, 1.5, 1.15), [side, side, cap, cap, side, side]));

  const glow = new T3.Sprite(new T3.SpriteMaterial({
    map: starGlowTexture, color: 0xffb55a, blending: T3.AdditiveBlending,
    transparent: true, depthWrite: false, fog: false, opacity: .8
  }));
  glow.scale.set(6, 6, 1);
  g.add(glow);

  const flame = new T3.Mesh(new T3.ConeGeometry(.12, .3, 8), new T3.MeshBasicMaterial({ color: 0xffd36e, fog: false, transparent: true }));
  flame.position.y = -.85;
  g.add(flame);

  g.scale.setScalar(scale);
  return { g, tex, mats: [side, cap, flame.material, glow.material], glow };
}

function spawnTextLanterns() {
  const chars = [...BDAY_TEXT].slice(0, 6);
  const th = cs.th;                              // 排成面向目前鏡頭的一排
  const rx = Math.cos(th), rz = -Math.sin(th);
  const gap = 3.6;

  chars.forEach((ch, i) => {
    const off = (i - (chars.length - 1) / 2) * gap;
    const L = makeLantern(ch, 2.2);
    L.g.rotation.y = th;
    L.g.position.set(rx * off, .4, rz * off - 1);
    L.g.visible = false;
    sc.add(L.g);
    bdayLanterns.push({
      ...L, text: true, x: rx * off, z: rz * off - 1, th,
      age: -i * .28, ty: 9.5 + (i % 2) * .6, ph: rnd(0, 6)
    });
  });
}

function spawnSmallLantern() {
  const L = makeLantern('', rnd(.6, .9));
  const o = { ...L, text: false, x: rnd(-24, 24), z: rnd(-20, 8), y: .3, age: 0, vy: rnd(1.2, 1.9), ph: rnd(0, 6) };
  L.g.position.set(o.x, o.y, o.z);
  sc.add(L.g);
  bdayLanterns.push(o);
}

function lanternStep(dt) {
  for (let i = bdayLanterns.length - 1; i >= 0; i--) {
    const o = bdayLanterns[i];
    o.age += dt;
    if (o.age < 0) continue;
    o.g.visible = true;

    let alpha = c01(o.age / 1.2);

    if (o.text) {
      const p = c01(o.age / 9);
      const y = .4 + (o.ty - .4) * (1 - Math.pow(1 - p, 3)) + (p >= 1 ? (o.age - 9) * .35 : 0);
      o.g.position.set(o.x + Math.sin(o.age * .8 + o.ph) * .35, y, o.z);
      o.g.rotation.y = o.th + Math.sin(o.age * .6 + o.ph) * .12;
      alpha *= c01((BDAY_LENGTH - bday.t) / 4);
    } else {
      o.y = (o.y || .3) + o.vy * dt;
      o.g.position.set(o.x + Math.sin(o.age * .7 + o.ph) * .6, o.y, o.z);
      o.g.rotation.y += dt * .3;
      alpha *= c01(1 - (o.y - 18) / 18);
      if (alpha <= 0 && o.y > 20) { removeLantern(i); continue; }
    }

    o.mats.forEach(m => { m.opacity = m === o.glow.material ? .8 * alpha : alpha; });
  }
}

function removeLantern(i) {
  const o = bdayLanterns[i];
  sc.remove(o.g);
  o.mats.forEach(m => m.dispose());
  if (o.tex) o.tex.dispose();
  bdayLanterns.splice(i, 1);
}

let bdayCamSaved = null;
let bdayCamTouched = false;
cv.addEventListener('pointerdown', () => { bdayCamTouched = true; }, true);
// ===== 生日星座文字：以原有星點排成四字 =====

let birthdayLetterLines = null;
let birthdayMeteorLines = null;
let birthdayLinePairs = [];
let birthdayStarsUsed = [];

function buildBirthdayStars() {

  const canvas = document.createElement('canvas');
  canvas.width = 960;
  canvas.height = 240;

  const g = canvas.getContext('2d', {
    willReadFrequently: true
  });

  g.clearRect(0, 0, 960, 240);

  g.strokeStyle = '#fff';
  g.lineWidth = 10;
  g.lineCap = 'round';
  g.lineJoin = 'round';

  g.font =
    '700 156px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';

  g.textAlign = 'center';
  g.textBaseline = 'middle';

  // 四個字分開描邊，不使用實心發光字
  [...'生日快樂'].forEach((char, i) => {
    g.strokeText(char, 120 + i * 240, 122);
  });

  const pixels =
    g.getImageData(0, 0, 960, 240).data;

  const dots = [];
  const step = 14;

  for (let ch = 0; ch < 4; ch++) {

    for (let y = 19; y < 221; y += step) {

      for (
        let x = ch * 240 + 22;
        x < (ch + 1) * 240 - 22;
        x += step
      ) {

        const a =
          pixels[(y * 960 + x) * 4 + 3];

        if (a > 55) {
          dots.push({ x, y, ch });
        }

      }
    }
  }

  if (!dots.length) return;

  // 根據當前攝影機建立空中的文字位置
  cam.updateMatrixWorld(true);

  const forward = new T3.Vector3();
  cam.getWorldDirection(forward);

  const right =
    new T3.Vector3(1, 0, 0)
      .applyQuaternion(cam.quaternion);

  const up =
    new T3.Vector3(0, 1, 0)
      .applyQuaternion(cam.quaternion);

  const depth = 120;

  // 手機和電腦都能完整容納四個字
  const width = Math.min(
    84,
    2 * depth *
    Math.tan(cam.fov * PI / 360) *
    cam.aspect * .83
  );

  const center =
    cam.position.clone()
      .addScaledVector(forward, depth)
      .addScaledVector(up, 10);

  birthdayStarsUsed = [];

  for (const s of stars) {
    s.birthdayTarget = null;
    s.meteorTarget = null;
  }

  const count = Math.min(
    stars.length,
    dots.length
  );

  // 使用球場原本的星星排列文字
  for (let i = 0; i < count; i++) {

    const dot = dots[
      Math.floor(
        (i + .5) * dots.length / count
      )
    ];

    const s = stars[i];

    s.birthdayTarget =
      center.clone()
        .addScaledVector(
          right,
          (dot.x / 960 - .5) * width
        )
        .addScaledVector(
          up,
          (.5 - dot.y / 240) * width * .25
        );

    // 流星雨最終朝球場附近下降
    s.meteorTarget = new T3.Vector3(
      rnd(-17, 17),
      rnd(1.8, 5.5),
      rnd(-13, 13)
    );

    s.meteorDelay = rnd(0, .8);

    birthdayStarsUsed.push({ s, dot });
  }

  // ===== 星座式連線 =====

  birthdayLinePairs = [];

  const used = birthdayStarsUsed;

  for (let i = 0; i < used.length; i++) {

    const a = used[i].dot;
    const near = [];

    for (
      let j = i + 1;
      j < used.length;
      j++
    ) {

      const b = used[j].dot;

      // 不跨字連線
      if (a.ch !== b.ch) continue;

      const d = Math.hypot(
        a.x - b.x,
        a.y - b.y
      );

      if (d >= 12 && d <= 24) {
        near.push({ j, d });
      }

    }

    near.sort((u, v) => u.d - v.d);

    near.slice(0, 2).forEach(n => {
      birthdayLinePairs.push([i, n.j]);
    });

  }

  if (birthdayLetterLines) {
    sc.remove(birthdayLetterLines);
    birthdayLetterLines.geometry.dispose();
    birthdayLetterLines.material.dispose();
  }

  const linePoints =
    birthdayLinePairs.flatMap(
      ([a, b]) => [
        used[a].s.birthdayTarget,
        used[b].s.birthdayTarget
      ]
    );

  birthdayLetterLines =
    new T3.LineSegments(

      new T3.BufferGeometry()
        .setFromPoints(linePoints),

      new T3.LineBasicMaterial({
        color: 0xdceaff,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        fog: false
      })

    );

  birthdayLetterLines.frustumCulled = false;
  sc.add(birthdayLetterLines);

  // ===== 流星尾痕 =====

  if (birthdayMeteorLines) {
    sc.remove(birthdayMeteorLines);
    birthdayMeteorLines.geometry.dispose();
    birthdayMeteorLines.material.dispose();
  }

  const meteorGeo = new T3.BufferGeometry();

  meteorGeo.setAttribute(
    'position',
    new T3.BufferAttribute(
      new Float32Array(count * 6),
      3
    )
  );

  birthdayMeteorLines =
    new T3.LineSegments(

      meteorGeo,

      new T3.LineBasicMaterial({
        color: 0xe8efff,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        fog: false
      })

    );

  birthdayMeteorLines.frustumCulled = false;
  sc.add(birthdayMeteorLines);

}


// ===== 星字聚集、下落與尾痕 =====

function moveBirthdayStars() {

  if (!bday.active) return;

  const t = bday.t;

  const gather =
    sm01(c01((t - 2.4) / 3.1));

  const fallStart = 13.8;

  const tails = birthdayMeteorLines
    ? birthdayMeteorLines.geometry
        .attributes.position
    : null;

  birthdayStarsUsed.forEach(
    ({ s }, i) => {

      const m =
        sm01(c01(
          (t - fallStart - s.meteorDelay) / 3.5
        ));

      // 原本的星空 → 星座文字
      const word =
        s.home.clone()
          .lerp(s.birthdayTarget, gather);

      // 星座文字 → 球場方向
      s.s.position
        .copy(word)
        .lerp(s.meteorTarget, m);

      // 流星尾痕朝飛行反方向延伸
      if (tails) {

        const head = s.s.position;

        const d =
          s.birthdayTarget.clone()
            .sub(s.meteorTarget)
            .normalize();

        const trail =
          5.8 * Math.sin(m * PI);

        tails.setXYZ(
          i * 2,
          head.x,
          head.y,
          head.z
        );

        tails.setXYZ(
          i * 2 + 1,
          head.x + d.x * trail,
          head.y + d.y * trail,
          head.z + d.z * trail
        );

      }

      // 下落時逐漸淡出
      s.s.material.opacity = Math.min(
        1,
        (.20 + .8 * gather) *
        (1 - .94 * m)
      );

      s.s.scale.setScalar(
        (
          s.baseSize * (1 - gather) +
          1.05 * gather
        ) *
        (1 - .35 * m)
      );

      if (s.halo) {
        s.halo.material.opacity = 0;
      }

    }
  );

  // 星座文字的半透明連線
  if (birthdayLetterLines) {

    birthdayLetterLines.material.opacity =

      .24 *
      sm01(c01((gather - .65) / .35)) *

      (
        1 -
        sm01(c01((t - fallStart) / .75))
      );

  }

  // 流星的短尾痕
  if (birthdayMeteorLines) {

    tails.needsUpdate = true;

    birthdayMeteorLines.material.opacity =

      .34 *
      sm01(c01((t - fallStart) / .45)) *

      (
        1 -
        sm01(c01((t - 17.7) / 1.3))
      );

  }

}


// ===== 演出結束：恢復所有原始星點 =====

function clearBirthdayStars() {

  for (const s of stars) {

    s.s.position.copy(s.home);
    s.s.scale.setScalar(s.baseSize);

    s.birthdayTarget = null;
    s.meteorTarget = null;
    s.meteorDelay = 0;

    if (s.halo) {
      s.halo.material.opacity = 0;
    }

  }

  birthdayStarsUsed = [];
  birthdayLinePairs = [];

  for (const line of [
    birthdayLetterLines,
    birthdayMeteorLines
  ]) {

    if (!line) continue;

    sc.remove(line);
    line.geometry.dispose();
    line.material.dispose();

  }

  birthdayLetterLines = null;
  birthdayMeteorLines = null;

}

// ===== 遠方的小型煙火 =====

function distantBirthdayFirework(x, z) {

  // 不使用原本的大型煙火演出
  // 只讓少量星點在遠處散開

  for (let i = 0; i < 28; i++) {

    const a = i * PI * 2 / 28;
    const v = rnd(2.3, 4.5);

    fwEmit(
      x,
      rnd(38, 43),
      z,

      Math.cos(a) * v,
      Math.sin(a) * v,
      rnd(-.6, .6),

      FW_WARM,

      1.9,
      .97,
      -.55,
      0
    );

  }

}

// ===== 生日彩蛋：星座文字、流星雨與音樂同步 =====

function startBirthday() {

  if (bday.active) return;

  // 特殊視角先返回球場
  if (
    typeof window.worldExitSpecialView === 'function'
  ) {
    window.worldExitSpecialView();
  }

  Object.assign(bday, {

    active: true,
    t: 0,
    lit: false,

    glow: 0,
    fireBurst: 0,
    starFlash: 0,
    flash: 0,
    magic: 0,

    theme: BDAY_THEMES[0],

    wordBuilt: false,
    sparkOne: false,
    sparkTwo: false,

    groundBounce: false,
    catReacted: false

  });

  candleBlowAt.fill(-Infinity);

  flames.forEach(f => {
    f.t = .6;
  });

  bdayShade.style.opacity = '.87';
  ribbonMesh.visible = false;

  bdayCamTouched = false;

  bdayCamSaved = {
    th: ct.th,
    ph: ct.ph,
    d: ct.d,
    tilt: ct.tilt,
    x: tgtP.x,
    z: tgtP.z
  };

  // 原本音樂淡出，生日旋律逐漸進入
  beginBirthdayMusic();

}


// ===== 結束生日彩蛋 =====

function endBirthday() {

  bday.active = false;

  bday.glow =
    bday.fireBurst =
    bday.starFlash =
    bday.flash =
    bday.magic = 0;

  bdayShade.style.opacity = '0';

  flowerSets.forEach(set => {
    set.mesh.visible = false;
  });

  pools.forEach(p => {
    p.material.opacity = 0;
  });

  flares.forEach(s => {
    s.material.opacity = 0;
  });

  clearBirthdayStars();

  // 最後讓視線停在球場
  if (
    bdayCamSaved &&
    !bdayCamTouched
  ) {

    ct.th = bdayCamSaved.th;
    ct.ph = 1.03;
    ct.tilt = 0;
    ct.d = Math.max(27, bdayCamSaved.d);

  }

  bdayCamSaved = null;

  endBirthdayMusic();

}


// ===== 20 秒生日時間軸 =====

function birthdayStep(dt) {

  fwStep(dt);

  if (!bday.active) return;

  // 音樂有播放時，以音訊時鐘同步畫面
  if (
    birthdayAudioStart !== null &&
    musicCtx &&
    musicCtx.state === 'running'
  ) {

    bday.t = Math.min(
      BDAY_LENGTH,
      Math.max(
        bday.t,
        musicCtx.currentTime -
        birthdayAudioStart
      )
    );

  } else {

    // 靜音時仍正常播放動畫
    bday.t = Math.min(
      BDAY_LENGTH,
      bday.t + dt
    );

  }

  const t = bday.t;


  // ===== 1.2 秒：燭火重新燃起 =====

  if (t >= 1.2 && !bday.lit) {

    bday.lit = true;

    flames.forEach(f => {
      f.t = 7.2;
      f.pop = .3;
    });

    flowerSets.forEach(s => {
      s.mesh.visible = true;
    });

    // 排球第一次輕彈
    spikeFlight = null;
    hover = null;

    b.drag = false;
    b.armed = 0;
    b.combo = 0;

    if (
      Math.abs(ball.position.x) > 9 ||
      Math.abs(ball.position.z) > 4.5
    ) {

      ball.position.set(-3, BR, 2);

    } else {

      ball.position.y = BR;

    }

    bv.set(
      rnd(-.2, .2),
      5.0,
      rnd(-.2, .2)
    );

    b.sq = .12;


    // 先將視線引導到星空
    if (!bdayCamTouched) {

      ct.ph = 1.38;
      ct.tilt = .58;
      ct.d = Math.max(ct.d, 32);

    }

  }


  // ===== 暗場緩緩消失 =====

  bdayShade.style.opacity =
    t < 1.2
      ? '.87'
      : String(
          .87 *
          (
            1 -
            sm01(c01((t - 1.2) / .7))
          )
        );


  // ===== 進入生日星夜 =====

  const nightIn =
    sm01(c01((t - 1.2) / 1.7));

  const nightOut =
    1 - sm01(c01((t - 18) / 2));

  bday.magic =
    nightIn * nightOut;

  sc.background.lerp(
    MAGIC_SKY,
    bday.magic * .94
  );

  sc.fog.color.copy(sc.background);

  amb.color.lerp(
    MAGIC_LIGHT,
    bday.magic * .55
  );

  sunL.intensity *=
    (1 - bday.magic * .7);

  starV = Math.max(
    starV,
    bday.magic * .95
  );

  cloudV *=
    (1 - bday.magic * .85);

  if (bday.magic > .4) {
    sun.visible = false;
  }

  bday.glow =
    .25 * bday.magic;

  bday.fireBurst =
    t >= 1.2
      ? Math.max(
          0,
          1 - (t - 1.2) / 1.6
        )
      : 0;


  // ===== 2.4 秒：建立星座文字 =====

  if (
    t >= 2.4 &&
    !bday.wordBuilt
  ) {

    bday.wordBuilt = true;
    buildBirthdayStars();

  }


  // ===== 遠方兩次小煙火 =====

  if (
    t >= 9 &&
    !bday.sparkOne
  ) {

    bday.sparkOne = true;

    distantBirthdayFirework(
      -20, -65
    );

  }

  if (
    t >= 12.3 &&
    !bday.sparkTwo
  ) {

    bday.sparkTwo = true;

    distantBirthdayFirework(
      25, -72
    );

  }


  // ===== 燭火周圍的柔和光線 =====

  if (bday.lit) {

    pools.forEach(p => {
      p.material.opacity =
        .25 * bday.magic;
    });

    flares.forEach(s => {
      s.material.opacity =
        .25 * bday.magic;
    });

  }


  // ===== 樹木開花 =====

  flowerStep(t);


  // ===== 13.8 秒：流星雨引導鏡頭向下 =====

  if (
    !bdayCamTouched &&
    t >= 13.8
  ) {

    const lower =
      sm01(c01((t - 13.8) / 3.25));

    ct.ph =
      1.38 + (1.03 - 1.38) * lower;

    ct.tilt =
      .58 * (1 - lower);

    ct.d =
      32 +
      (
        Math.max(27, bdayCamSaved.d) -
        32
      ) * lower;

    // 視線逐漸回到球場中央
    tgtP.x +=
      (0 - tgtP.x) *
      Math.min(1, dt * 1.7);

    tgtP.z +=
      (0 - tgtP.z) *
      Math.min(1, dt * 1.7);

  }


  // ===== 16.1 秒：排球再次彈跳 =====

  if (
    t >= 16.1 &&
    !bday.groundBounce
  ) {

    bday.groundBounce = true;

    ball.position.set(
      -3, BR, 2
    );

    bv.set(
      0, 4.8, 0
    );

    b.sq = .1;

  }


  // ===== 16.1 秒：黑貓的生日反應 =====

  if (
    t >= 16.1 &&
    !bday.catReacted
  ) {

    bday.catReacted = true;

    if (
      typeof window.worldBirthdayCatReaction
      === 'function'
    ) {

      window.worldBirthdayCatReaction();

    }

  }


  // ===== 音樂與彩蛋一起結束 =====

  if (t >= BDAY_LENGTH) {
    endBirthday();
  }

}

  mesh.position.y -= leaf.speed * dt;

  mesh.position.x += (

  ) * dt;

      q.m.scale.set(q.s.x*Math.max(.01,sc2),q.s.y*Math.max(.01,sc2),q.s.z*Math.max(.01,sc2));q.m.material.opacity=al});
    if(o.p>12){o.parts.forEach((q,k)=>q.m.position.set(k*6-9,q.m.position.y,q.m.position.z))}});
  /* stars */
 
stars.forEach(o => {

 o.s.material.opacity = Math.min(

 o.s.scale.setScalar(

});

      incoming.length > 10000

let impactAudioCtx = null;
let lastImpactTime = 0;

// 柔和、低沉的球體撞擊聲
function playSoftImpact(power = 0.5) {

  const AudioClass =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioClass || getSfxVolumeLevel() === 0) return;

  const stamp = performance.now();

  // 避免短時間重複播放
  if (stamp - lastImpactTime < 85) return;

  lastImpactTime = stamp;

  if (!impactAudioCtx) {
    impactAudioCtx = new AudioClass();
  }

  const ctx = impactAudioCtx;

  if (ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
  }

  const duration = 0.13;
  const length = Math.ceil(ctx.sampleRate * duration);

  const buffer = ctx.createBuffer(
    1,
    length,
    ctx.sampleRate
  );

  const data = buffer.getChannelData(0);

  // 短促的撞擊雜訊，不使用電子音高
  for (let i = 0; i < length; i++) {
    const fade = Math.pow(1 - i / length, 2);
    data[i] = (Math.random() * 2 - 1) * fade;
  }

  const source = ctx.createBufferSource();
  source.buffer = buffer;

  // 低通濾波，讓聲音更悶
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 320;
  filter.Q.value = 0.7;

  const gain = ctx.createGain();
  const now = ctx.currentTime;

  const strength = Math.max(
    0.1,
    Math.min(1, power)
  );

  const volume =
    (0.07 + strength * 0.12) * getSfxVolumeLevel();

  gain.gain.setValueAtTime(0.0001, now);

  gain.gain.exponentialRampToValueAtTime(
    volume,
    now + 0.008
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + duration
  );

  source.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  source.start(now);
  source.stop(now + duration);

  source.onended = () => {
    source.disconnect();
    filter.disconnect();
    gain.disconnect();
  };
}

// 一般落地：較輕的悶響

// 音樂速度：數字越大，旋律越慢
const MUSIC_SPEED = 0.8;

// 四組柔和和弦
const MUSIC_CHORDS = [
  [60, 64, 67, 71],
  [57, 60, 64, 67],
  [53, 57, 60, 64],
  [55, 59, 62, 67]
];

// 旋律音符的排列
const MUSIC_PATTERN = [0, 2, 1, 3, 2, 1, 0, 2];
// ===== 生日音樂：慢速音樂盒旋律 =====

let birthdayMusicBus = null;
let birthdayAudioStart = null;

// 音高採 MIDI 數字，第二個數字是音符時值
const BIRTHDAY_MELODY = [

  [60,.35], [60,.35], [62,.72],
  [60,.72], [65,.72], [64,1.10],

  [60,.35], [60,.35], [62,.72],
  [60,.72], [67,.72], [65,1.10],

  [60,.35], [60,.35], [72,.72],
  [69,.72], [65,.72], [64,.72],
  [62,1.12],

  [70,.35], [70,.35], [69,.72],
  [65,.72], [67,.72], [65,2.15]

];


// ===== 產生柔和的生日音符 =====

function birthdayTone(
  midi,
  at,
  duration,
  strength
) {

  if (!musicCtx || !birthdayMusicBus) return;

  const hz =
    440 * Math.pow(
      2,
      (midi - 69) / 12
    );

  // 主音加上極淡的八度泛音
  for (const [ratio, volume] of [
    [1, strength],
    [2, strength * .14]
  ]) {

    const osc =
      musicCtx.createOscillator();

    const gain =
      musicCtx.createGain();

    osc.type = 'sine';

    osc.frequency.setValueAtTime(
      hz * ratio,
      at
    );

    gain.gain.setValueAtTime(
      .0001,
      at
    );

    gain.gain.exponentialRampToValueAtTime(
      Math.max(.0002, volume),
      at + .045
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      at + duration
    );

    osc.connect(gain);
    gain.connect(birthdayMusicBus);

    osc.start(at);
    osc.stop(at + duration + .025);

    osc.onended = () => {
      osc.disconnect();
      gain.disconnect();
    };

  }

}


// ===== 開始生日音樂 =====

function beginBirthdayMusic() {

  birthdayAudioStart = null;

  // 玩家原本關閉音樂，就保持靜音
  if (
    !musicAudible() ||
    !AudioContextClass
  ) return;

  prepareMusicAudio();

  if (!musicCtx || !musicMaster) return;

  const now = musicCtx.currentTime;

  birthdayAudioStart = now;


  // 停止一般背景音樂繼續排入新音符
  if (musicTimer !== null) {

    clearInterval(musicTimer);
    musicTimer = null;

  }


  // 原本音樂漸弱
  musicMaster.gain.cancelScheduledValues(now);

  musicMaster.gain.setValueAtTime(
    musicMaster.gain.value,
    now
  );

  musicMaster.gain.linearRampToValueAtTime(
    .0001,
    now + 1.15
  );


  // 建立生日旋律專屬音量
  birthdayMusicBus =
    musicCtx.createGain();

  birthdayMusicBus.gain.setValueAtTime(
    .0001,
    now
  );

  birthdayMusicBus.gain.linearRampToValueAtTime(
    getMusicVolumeLevel() * .82,
    now + 2
  );

  birthdayMusicBus.gain.setValueAtTime(
    getMusicVolumeLevel() * .82,
    now + 18.5
  );

  birthdayMusicBus.gain.linearRampToValueAtTime(
    .0001,
    now + 20
  );

  birthdayMusicBus.connect(
    musicCtx.destination
  );


  // 生日旋律從 1.55 秒開始
  let at = now + 1.55;

  BIRTHDAY_MELODY.forEach(
    ([midi, length], i) => {

      birthdayTone(
        midi,
        at,

        // 最後一個音延長到約第 20 秒
        i === BIRTHDAY_MELODY.length - 1
          ? length + .78
          : length * .91,

        .095
      );

      // 每句開頭加一個極輕的低音
      if ([0, 6, 12, 19].includes(i)) {

        const bass =
          i === 6
            ? 48
            : i === 19
              ? 46
              : 53;

        birthdayTone(
          bass,
          at,
          2.15,
          .018
        );

      }

      at += length;

    }
  );

}


// ===== 生日音樂結束，恢復原本背景音樂 =====

function endBirthdayMusic() {

  birthdayAudioStart = null;

  if (birthdayMusicBus && musicCtx) {

    const bus = birthdayMusicBus;
    const now = musicCtx.currentTime;

    bus.gain.cancelScheduledValues(now);

    bus.gain.setTargetAtTime(
      .0001,
      now,
      .05
    );

    birthdayMusicBus = null;

    setTimeout(() => {
      bus.disconnect();
    }, 500);

  }

  // 不改變玩家原本的音樂設定
  if (musicAudible()) {
    startMusic();
  }

}
// 產生一個柔和的音符
function playMusicNote(
  midi,
  start,
  duration,
  volume,
  attack = 0.04
) {

  const oscillator = musicCtx.createOscillator();
  const gain = musicCtx.createGain();

  const frequency =
    440 * Math.pow(2, (midi - 69) / 12);

  oscillator.type = 'sine';
  oscillator.frequency.setValueAtTime(
    frequency,
    start
  );

  gain.gain.setValueAtTime(0.0001, start);

  gain.gain.exponentialRampToValueAtTime(
    volume,
    start + attack
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );

  oscillator.connect(gain);
  gain.connect(musicMaster);

  oscillator.start(start);
  oscillator.stop(start + duration + 0.02);
}

// 安排下一組旋律
function scheduleMusic() {

  if (!musicCtx || !musicOn) return;

  while (
    nextMusicTime < musicCtx.currentTime + 0.6
  ) {

    const chordIndex =
      Math.floor(musicStep / 8) % 4;

    const noteIndex = musicStep % 8;

    const chord = MUSIC_CHORDS[chordIndex];

    // 每八拍加入柔和的背景和弦
    if (noteIndex === 0) {

      chord.forEach(midi => {
        playMusicNote(
          midi - 12,
          nextMusicTime,
          6.3,
          0.028,
          1.0
        );
      });
    }

    // 播放主要旋律
    playMusicNote(
      chord[MUSIC_PATTERN[noteIndex]] + 12,
      nextMusicTime,
      1.9,
      0.11
    );

    nextMusicTime += MUSIC_SPEED;
    musicStep++;
  }
}

// 開始播放音樂
async function startMusic() {

  // 生日彩蛋播放時，不啟動一般背景旋律
  if (bday.active) {
    applyMusicVolume();
    return;
  }

  if (!musicOn || !AudioContextClass || musicTimer) {
    return;
  }

  if (!musicCtx) {

    musicCtx = new AudioContextClass();

    musicMaster = musicCtx.createGain();
    musicMaster.gain.value = 0;

    musicMaster.connect(musicCtx.destination);
  }

  try {
    await musicCtx.resume();
  } catch (e) {
    return;
  }

  if (!musicOn || musicTimer || bday.active) return;

  const now = musicCtx.currentTime;

  // 音量漸漸變大
  musicMaster.gain.cancelScheduledValues(now);

musicMaster.gain.setTargetAtTime(
  getMusicVolumeLevel(),
  now,
  0.4
);

  musicStep = 0;
  nextMusicTime = now + 0.08;

  scheduleMusic();

  musicTimer = setInterval(
    scheduleMusic,
    150
  );
}

// 關閉音樂
function stopMusic() {

  if (musicTimer !== null) {
    clearInterval(musicTimer);
    musicTimer = null;
  }

  if (!musicCtx || !musicMaster) return;

  const now = musicCtx.currentTime;

  // 音樂柔和地淡出
  musicMaster.gain.cancelScheduledValues(now);

  musicMaster.gain.setTargetAtTime(
    0.0001,
    now,
    0.15
  );
  // 使用者在生日演出中關閉音樂，也立即淡出生日歌
if (birthdayMusicBus) {

  birthdayMusicBus.gain.cancelScheduledValues(now);

  birthdayMusicBus.gain.setTargetAtTime(
    .0001,
    now,
    .12
  );

}
}

  const v = Number(value) / 100;

  if (v <= 0.5) return v;

  return 0.5 + (v - 0.5) * 2;
}

  return boostVolume(musicVolume.value);

  );

  slider.addEventListener(
    'focus',
    showVolumePanel
  );
}

// 音樂：即時調整
musicVolume.addEventListener('input', () => {

  setMusicVolume(
    Number(musicVolume.value)
  );
});

// 音效：即時調整並預聽
sfxVolume.addEventListener('input', () => {

  setSfxVolume(
    Number(sfxVolume.value)
  );

  previewSfx();
});

// ===== 第一次碰觸球場 =====

cv.addEventListener('pointerdown', () => {

  if (musicAudible()) {
    startMusic();
  }

}, { once: true });

// 初始化
setSfxVolume(Number(sfxVolume.value));
updateMusicButton();

/* ===== 開發者控制台通訊 ===== */

if (VB_IS_DEV) {

  window.addEventListener('message', event => {

    if (event.source !== window.parent) return;
    if (event.origin !== location.origin) return;

    const msg = event.data;

    if (!msg || msg.type !== 'VB_DEV_COMMAND') return;

    if (msg.action === 'ping') {
      window.parent.postMessage({
        type: 'VB_DEV_READY'
      }, location.origin);
    }

    if (msg.action === 'time') {
      const hour = Number(msg.hour);

      if (Number.isFinite(hour) && hour >= 0 && hour < 24) {
        Tm = hour < 4.5 ? hour + 24 : hour;
        tgt = null;
        phaseElapsed = 0;
      }
    }

    if (msg.action === 'resetCamera') {
      ct.th = -0.55;
      ct.ph = 1.0;
      ct.d = 27;
      ct.tilt = 0;
    }
    
   // 開發者：立即觸發生日彩蛋
   if (msg.action === 'birthday') {
     startBirthday();
   }
  
    // 預覽造訪天數
    if (msg.action === 'visitDay') {
      const day = Number(msg.day);

      if (Number.isInteger(day) && day >= 1 && day <= 365) {
        VB_DEV_STATE.visitDay = day;
      }
    }

  });

  window.parent.postMessage({
    type: 'VB_DEV_READY'
  }, location.origin);

}
setTimeout(()=>$('#tip').style.opacity=0,14000);
</script>
