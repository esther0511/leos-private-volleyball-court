<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑貓模型預覽｜排球場</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edeae2;color:#283334;font:16px/1.45 system-ui,sans-serif}
main{display:flex;flex-direction:column;height:100vh;height:100dvh}
header,footer{padding:12px max(16px,4vw);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.2rem;margin:0}small{color:#505955}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage{flex:1;min-height:0}
label{display:flex;align-items:center;gap:8px}
select,button{font:inherit;padding:7px 12px;border:1px solid #88938e;border-radius:6px;color:inherit;background:#f9f8f3}
</style>
</head>
<body><main>
<header><h1>黑貓模型預覽</h1><small>拖曳畫面可轉動視角</small></header>
<div id="stage"><canvas id="view" aria-label="可旋轉的立體黑貓模型"></canvas></div>
<footer><label>姿勢 <select id="action"><option value="sit">坐姿</option><option value="stand">站立</option><option value="walk">走動</option><option value="sleep">睡覺</option><option value="stretch">伸懶腰</option><option value="yawn">打哈欠</option><option value="meow">喵叫嘴形</option><option value="tail">甩尾</option><option value="ears">動耳朵</option><option value="party">生日派對帽</option></select></label><button id="reset" type="button">回到原畫視角</button></footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./cat-model.js"></script>
<script>
const canvas=document.querySelector('#view'), stage=document.querySelector('#stage'), action=document.querySelector('#action');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0xedeae2);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.05,20);
scene.add(new THREE.AmbientLight(0xfffaf0,.95));
const key=new THREE.DirectionalLight(0xfffaf4,.86);key.position.set(3,5,-2);scene.add(key);
const cat={},root=new THREE.Group();scene.add(root);VBCatModel.build(root,cat);
const target=new THREE.Vector3(-.12,.73,-.06);
let yaw,pitch,drag,phase=0,last=performance.now();
function reset(){yaw=-.62;pitch=.061}
reset();document.querySelector('#reset').onclick=reset;
canvas.onpointerdown=e=>{if(drag)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(drag?.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.012;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-drag.y)*.010,-.22,1.2);drag.x=e.clientX;drag.y=e.clientY};
canvas.onlostpointercapture=()=>drag=null;
action.onchange=()=>phase=0;
function resize(){
 const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);
 const half=Math.max(.86,.86*h/Math.max(1,w));
 camera.top=half;camera.bottom=-half;camera.right=half*w/h;camera.left=-camera.right;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);resize();
function frame(now){
 const dt=Math.min(.06,(now-last)/1000);last=now;phase+=dt;
 const act=action.value, wave=Math.pow(Math.sin(phase*.95),2), t=now/1000;
 VBCatModel.pose(cat,{sleeping:act==='sleep',walking:act==='walk',standing:act==='stand',party:act==='party',
    closed:act==='sleep'||act==='yawn'||phase%4.1>3.98,act,s:wave},t,dt);
 const wide=['stand','walk','stretch'].includes(act);
 const zoom=wide?.80:1;camera.zoom+=(zoom-camera.zoom)*(1-Math.exp(-6*dt));camera.updateProjectionMatrix();
 camera.position.set(Math.cos(yaw)*Math.cos(pitch),Math.sin(pitch),Math.sin(yaw)*Math.cos(pitch)).multiplyScalar(3).add(target);
 camera.lookAt(target);renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
